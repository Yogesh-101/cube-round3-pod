services:
  # Python FastAPI Orchestrator Backend Service
  - type: web
    name: cube-orchestrator-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn orchestration.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OUT_DIR
        value: "out"
      - key: JWT_SECRET
        generateValue: true

  # React / Vite Frontend Static Site (static sites are always free on Render, plan key is omitted)
  - type: web
    name: cube-orchestrator-web
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: "web"
    envVars:
      - key: VITE_API_URL
        value: "https://cube-orchestrator-api.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
